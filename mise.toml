[tools]
cue = "0.17.1"

[tasks.land]
description = "Merge a pull request only after CI passes: mise run land -- <number>"
run = "gh pr checks {{arg(name=\"pr\")}} --watch --fail-fast && gh pr merge {{arg(name=\"pr\")}} --squash --delete-branch"

[tasks.gallery-docs]
description = "Regenerate the README PNGs in docs/gallery from the examples"
run = ["cargo build --release", "scripts/gallery-docs.sh docs/gallery target/release/stencil"]

[tasks.import-themes]
description = "Re-import the pinned base16 schemes of the imported theme tier"
run = ["cargo build --release", "scripts/import-themes.sh target/release/stencil"]
