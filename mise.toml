min_version = "2026.9.2"

[tools]
# mr_boxington runs cargo through mbx, the shared compiler-output cache (mise 2026.9.2+).
rust = { version = "1.94", components = "rustfmt,clippy", mr_boxington = true }
mr-boxington = "1.23.0"
cue = "0.17.1"
opengrep = "1.30.2"
zizmor = "1.30.1"
"github:jdx/jactionlint" = "2.0.2"

[tasks.ci]
description = "Every check CI runs: fmt, clippy, tests, CUE, gallery docs, opengrep, zizmor and jactionlint"
run = "cargo run -q -p xtask -- ci"

[tasks.opengrep]
description = "Test the opengrep rules against their fixtures, then scan the repository with them"
run = "cargo run -q -p xtask -- opengrep"

[tasks.workflows]
description = "Audit the GitHub workflows with zizmor and jactionlint at pedantic"
run = "cargo run -q -p xtask -- workflows"

[tasks.gallery]
description = "Build the release binary and render every example into target/gallery"
run = "cargo run -q -p xtask -- gallery target/gallery"

[tasks.release]
description = "Publish the GitHub release of tag GITHUB_REF_NAME with the gallery attached"
run = "cargo run -q -p xtask -- release"

[tasks.cache-trim]
description = "Collect the mbx store down to the size CI saves"
run = "mbx gc --max-size 3GiB"

[tasks.land]
description = "Merge a pull request only after its CI workflow run passes: mise run land -- <number>"
run = "scripts/land.sh {{arg(name=\"pr\")}}"

[tasks.gallery-docs]
description = "Regenerate the README PNGs in docs/gallery from the examples"
run = ["cargo build --release", "scripts/gallery-docs.sh docs/gallery target/release/stencil"]

[tasks.import-themes]
description = "Re-import the pinned base16 schemes of the imported theme tier"
run = ["cargo build --release", "scripts/import-themes.sh target/release/stencil"]

[tasks.theme-docs]
description = "Regenerate the README theme previews in docs/themes"
run = ["cargo build --release", "scripts/theme-docs.sh docs/themes target/release/stencil"]
