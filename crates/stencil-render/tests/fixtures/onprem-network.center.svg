    <g data-id="/title" data-tag="Title">
      <text x="20" y="61.28" xml:space="preserve" font-family="Inter" font-size="20" font-weight="700" letter-spacing="-0.4" fill="#202124">Treatment plant network of a water utility</text>
    </g>
    <g data-id="/lede" data-tag="Lede">
      <text x="20" y="82.53" xml:space="preserve" font-family="Inter" font-size="13" font-weight="400" fill="#5F6368">The core switch trunks the office and control VLANs to the edge firewall, which routes them to the DMZ and the transit VLAN. The public outage map runs in the DMZ, and traffic that starts there never reaches</text>
      <text x="20" y="98.13" xml:space="preserve" font-family="Inter" font-size="13" font-weight="400" fill="#5F6368">the plant controllers.</text>
    </g>
