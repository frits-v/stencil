    <g data-id="/title" data-tag="Title">
      <text x="20" y="61.28" xml:space="preserve" font-family="Inter" font-size="20" font-weight="700" letter-spacing="-0.4" fill="#202124">Two firewall zones and four VLANs at the head office</text>
