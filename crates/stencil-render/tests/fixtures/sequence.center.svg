    <g data-id="/title" data-tag="Title">
      <text x="20" y="61.28" xml:space="preserve" font-family="Inter" font-size="20" font-weight="700" letter-spacing="-0.4" fill="#202124">A batch job from submission to completion</text>
    </g>
    <g data-id="/lede" data-tag="Lede">
      <text x="20" y="82.53" xml:space="preserve" font-family="Inter" font-size="13" font-weight="400" fill="#5F6368">An operator submits a job in the console. The API queues it and answers at once; a worker pulls the job, reports progress and acknowledges it once the result is stored. A cancel that arrives while the job runs</text>
      <text x="20" y="98.13" xml:space="preserve" font-family="Inter" font-size="13" font-weight="400" fill="#5F6368">is refused.</text>
    </g>
