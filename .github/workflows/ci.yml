name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
  cue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cue-lang/setup-cue@a93fa358375740cd8b0078f76355512b9208acb1 # v1.0.1
        with:
          version: v0.17.1
      - run: CUE=cue ./cue/check.sh
  opengrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.0
          install_args: opengrep
      - run: scripts/opengrep.sh
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: ./target/release/stencil gallery target/gallery
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: gallery
          path: target/gallery
          if-no-files-found: error
      - name: docs/gallery matches the examples
        if: ${{ !cancelled() }}
        run: scripts/check-gallery-docs.sh target/release/stencil "$RUNNER_TEMP/gallery-docs"
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: gallery-docs
          path: ${{ runner.temp }}/gallery-docs
          if-no-files-found: ignore
      - name: docs/themes matches the theme previews
        if: ${{ !cancelled() }}
        run: scripts/check-theme-docs.sh target/release/stencil "$RUNNER_TEMP/theme-docs"
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: theme-docs
          path: ${{ runner.temp }}/theme-docs
          if-no-files-found: ignore
