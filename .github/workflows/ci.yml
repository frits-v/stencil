name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read # checkout only
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  rust:
    name: fmt, clippy and workspace tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
  cue:
    name: CUE grammars and examples
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: cue-lang/setup-cue@a93fa358375740cd8b0078f76355512b9208acb1 # v1.0.1
        with:
          version: v0.17.1
      - run: CUE=cue ./cue/check.sh
  lint:
    name: opengrep, zizmor and jactionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.0
          install_args: opengrep zizmor github:jdx/jactionlint
      - run: scripts/opengrep.sh
      - name: workflows pass zizmor and jactionlint at pedantic
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run workflows
  gallery:
    name: gallery and README images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release
      - run: ./target/release/stencil gallery target/gallery
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: gallery
          path: target/gallery
          if-no-files-found: error
      - name: docs/gallery matches the examples
        if: ${{ !cancelled() }}
        run: scripts/check-gallery-docs.sh target/release/stencil "$RUNNER_TEMP/gallery-docs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() }}
        with:
          name: gallery-docs
          path: ${{ runner.temp }}/gallery-docs
          if-no-files-found: ignore
      - name: docs/themes matches the theme previews
        if: ${{ !cancelled() }}
        run: scripts/check-theme-docs.sh target/release/stencil "$RUNNER_TEMP/theme-docs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() }}
        with:
          name: theme-docs
          path: ${{ runner.temp }}/theme-docs
          if-no-files-found: ignore
