name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release
      - run: ./target/release/stencil gallery target/gallery
      - run: cd target && zip -r -X ../gallery.zip gallery
      - name: Create the release with the gallery attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes gallery.zip target/gallery/*/center/*.png
