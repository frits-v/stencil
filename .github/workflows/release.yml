name: release
# Every push to main: release-plz opens or updates the release pull request, and a merged
# release pull request is tagged, released and gets its archives and gallery. Nothing here
# runs on a tag push; the tags are made by the release job.
on:
  push:
    branches: [main]
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    # Runs of one commit deduplicate; runs of different commits never cancel each other.
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write # create the tags and the GitHub release, upload the gallery
      pull-requests: read # find the release pull request a commit came from
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.13
          cache: false # a published artifact is built from clean tools
          install_args: rust mr-boxington release-plz gh
      - id: release
        run: mise run release
        env:
          GITHUB_TOKEN: ${{ github.token }}
  binaries:
    name: binaries (${{ matrix.os }})
    needs: release
    if: ${{ needs.release.outputs.tag != '' }}
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    concurrency:
      group: binaries-${{ github.sha }}-${{ matrix.os }}
      cancel-in-progress: false
    permissions:
      contents: write # upload archives to the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.13
          cache: false
          install_args: rust mr-boxington cargo-dist gh
      - run: mise run release-binaries
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
  release-pr:
    name: release-pr
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The App key is a secret of this environment, which admits only the default branch.
    environment:
      name: release
      deployment: false
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    permissions:
      contents: read # checkout
    concurrency:
      group: release-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.13
          cache: false
          install_args: rust mr-boxington release-plz
      # Built before the key is mapped; the build scripts of xtask's locked dependencies run in
      # this job and are trusted with the App key.
      - run: cargo build --locked -p xtask
      - run: target/debug/xtask release-pr
        env:
          STENCIL_RELEASE_CLIENT_ID: ${{ vars.STENCIL_RELEASE_CLIENT_ID }}
          STENCIL_RELEASE_APP_ID: ${{ vars.STENCIL_RELEASE_APP_ID }}
          STENCIL_RELEASE_APP_PRIVATE_KEY: ${{ secrets.STENCIL_RELEASE_APP_PRIVATE_KEY }}
