name: release
on:
  push:
    tags: ['v*']
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  gallery:
    name: release with the gallery attached
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # No build cache: a published artifact is built from a clean target directory.
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build --release
      - run: ./target/release/stencil gallery target/gallery
      - run: cd target && zip -r -X ../gallery.zip gallery
      - name: Create the release with the gallery attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes gallery.zip target/gallery/*/center/*.png
