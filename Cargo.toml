[workspace]
resolver = "3"
members = [
    "crates/stencil-model",
    "crates/stencil-text",
    "crates/stencil-layout",
    "crates/stencil-render",
    "crates/stencil-cli",
    "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
taffy = "=0.14.0"
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash"] }
resvg = { version = "=0.48.1", default-features = false, features = ["text"] }
# The glyph outline reader usvg uses, at its version, for the portable SVG's glyph defs.
skrifa = { version = "=0.44.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
base64 = "0.23"
sha2 = "0.11"
jsonschema = { version = "0.58", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
unreachable = "deny"

# Dependencies (resvg, tiny-skia, cosmic-text, png) build optimized in test and dev builds,
# so the tests that render every example finish in seconds; workspace crates keep debug.
[profile.dev.package."*"]
opt-level = 3
