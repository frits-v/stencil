[workspace]
resolver = "2"
members = ["crates/stencil-model", "crates/stencil-text", "crates/stencil-layout", "crates/stencil-render", "crates/stencil-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2"
thiserror = "2.0"
anyhow = "1.0"
taffy = "0.14"
cosmic-text = "0.19"
fontdb = "0.24"
resvg = "0.48"
usvg = "0.48"
tiny-skia = "0.12"
png = "0.18"
clap = { version = "4.6", features = ["derive"] }
base64 = "0.22"
